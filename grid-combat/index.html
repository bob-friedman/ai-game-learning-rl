<!DOCTYPE html>
<!--
GRIDWARS - ENHANCED EDITION v1.2
==================================
BUG FIXES IN THIS VERSION:

1. DEFEND MODE NOW LATCHES (was: infantry vacillated turn-by-turn)
   - shouldDefend() was stateless — tiny position shifts flipped the
     timing calculation off for one turn, letting units drift back to
     terrain comfort before the alarm re-triggered.
   - aiDefendLatch: once defend mode engages it stays engaged until
     ALL capturing threats leave the detection radius entirely.
   - HQ pull weight raised further: 15 → 20 for more decisive retreat.

PREVIOUS BUG FIXES (v1.1):
---------------------------
2. CAPTURE ALWAYS PROGRESSES
   - Math.max(1,...) ensures even a 1-HP unit turns the key each turn.

3. DEFEND MODE ACTUALLY RETREATS
   - HQ pull weight raised 4 → 15, enemy-approach term silenced,
     terrain comfort suppressed during defend mode.
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>Grid Combat - Enhanced Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="board"></div>
<div id="ui">
<div>Turn: <span id="turn">1</span> | <span id="team" class="stellar">Gold</span></div>
<div id="log"></div>
<button onclick="confirmEndTurn()">End Turn</button>
<button onclick="undoMove()" id="undo-btn" disabled>Undo Move</button>
<button onclick="confirmReset()">Reset</button>
<div id="info-panel">
<div class="info-row"><span class="info-label">Terrain:</span><span id="info-terrain">-</span></div>
<div class="info-row"><span class="info-label">Defense:</span><span id="info-defense">-</span></div>
<div class="info-row"><span class="info-label">Move Cost:</span><span id="info-move">-</span></div>
<div class="info-row"><span class="info-label">Structure:</span><span id="info-structure">-</span></div>
<div class="info-row"><span class="info-label">Unit:</span><span id="info-unit">-</span></div>
<div class="info-row" id="pending-capture-info" style="color: #0f0; display: none;"></div>
</div>
<div id="scenario-select">
<strong>Scenario:</strong>
<select id="scenario-picker" onchange="loadScenario(this.value)" style="width: 150px; margin: 4px 0; font-size: 11px;">
<optgroup label="Training Scenarios">
<option value="borderClash">Border Clash</option>
<option value="siege">Siege</option>
<option value="bridgeHead">River Crossing</option>
<option value="gauntlet">The Gauntlet</option>
</optgroup>
<optgroup label="Advanced Training">
  <option value="borderClashAdvanced">Border Clash - Advanced</option>
  <option value="siegeAdvanced">Siege - Advanced</option>
  <option value="bridgeHeadAdvanced">River Crossing - Advanced</option>
  <option value="gauntletAdvanced">The Gauntlet - Advanced</option>
</optgroup>
<optgroup label="Random Skirmish">
<option value="skirmishMedium">Lake Crossing (16x14)</option>
<option value="skirmishLarge">Mountain Frontier (20x16)</option>
</optgroup>
</select>
<button onclick="randomizeCurrent()" id="random-btn" style="display:none;">New Random Map</button>
</div>
</div>
<div id="modal-overlay">
<div id="modal">
<h3>Reset Game?</h3>
<p>Current progress will be lost.</p>
<button onclick="executeReset()" style="background: #633;">Reset</button>
<button onclick="closeModal()" style="background: #363;">Cancel</button>
</div>
</div>
<div id="turn-confirm-modal">
<div id="turn-confirm-box">
<h3>End Turn?</h3>
<p id="turn-confirm-msg">You have unmoved units.</p>
<button onclick="executeEndTurn()" style="background: #a60;">End Turn</button>
<button onclick="closeTurnConfirm()" style="background: #363;">Cancel</button>
</div>
</div>
<script src="game.js"></script>
</body>
</html>
